<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Consultorio Médico - Gestión</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- FullCalendar CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css"
      rel="stylesheet"
    />

    <style>
      body,
      html {
        height: 100%;
      }
      #sidebar {
        width: 250px;
      }
    </style>
  </head>
  <body>
    <div class="d-flex vh-100">
      <!-- Sidebar -->
      <nav id="sidebar" class="bg-light border-end p-3">
        <h3>Consultorio</h3>
        <ul class="nav nav-pills flex-column">
          <li class="nav-item mb-2">
            <a href="#" class="nav-link active" data-section="inicio">Inicio</a>
          </li>
          <li class="nav-item mb-2">
            <a href="#" class="nav-link" data-section="pacientes">Pacientes</a>
          </li>
          <li class="nav-item mb-2">
            <a href="#" class="nav-link" data-section="turnos">Turnos</a>
          </li>
          <li class="nav-item mb-2">
            <a href="#" class="nav-link" data-section="caja">Caja</a>
          </li>
        </ul>
      </nav>

      <!-- Main content -->
      <main id="mainContent" class="flex-grow-1 p-4 overflow-auto"></main>
    </div>

    <!-- Modal ficha paciente -->
    <div
      class="modal fade"
      id="modalFichaPaciente"
      tabindex="-1"
      aria-labelledby="modalFichaPacienteLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalFichaPacienteLabel">
              Ficha del Paciente
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>
          <div class="modal-body">
            <h4 id="fichaNombreCompleto"></h4>
            <p><strong>DNI:</strong> <span id="fichaDNI"></span></p>
            <p><strong>Teléfono:</strong> <span id="fichaTelefono"></span></p>
            <p><strong>Dirección:</strong> <span id="fichaDireccion"></span></p>
            <p>
              <strong>Obra Social:</strong> <span id="fichaObraSocial"></span>
            </p>
            <p><strong>Género:</strong> <span id="fichaGenero"></span></p>
            <p>
              <strong>Fecha de Nacimiento:</strong>
              <span id="fichaFechaNacimiento"></span>
            </p>

            <hr />
            <h5>Turnos</h5>
            <ul id="fichaTurnos" class="list-group mb-3"></ul>

            <h5>Pagos</h5>
            <ul id="fichaPagos" class="list-group mb-3"></ul>

            <h5>Notas</h5>
            <ul id="fichaNotas" class="list-group mb-3"></ul>

            <h5>Archivos</h5>
            <ul id="fichaArchivos" class="list-group mb-3"></ul>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cerrar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Tu script principal -->
    <script type="module" src="script.js"></script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- FullCalendar JS (global build) -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  </body>
</html>
