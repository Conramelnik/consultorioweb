<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Consultorio Odontológico</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      body,
      html {
        height: 100%;
        margin: 0;
      }
      #sidebar {
        position: fixed;
        top: 0;
        left: 0;
        width: 250px;
        height: 100vh;
        padding: 1rem;
        background-color: #f8f9fa;
        border-right: 1px solid #dee2e6;
      }
      #mainContent {
        margin-left: 250px;
        padding: 1.5rem;
      }
    </style>
  </head>
  <body>
    <!-- Sidebar fijo a la izquierda -->
    <nav id="sidebar">
      <h4>Consultorio</h4>
      <ul class="nav flex-column">
        <li class="nav-item mb-2">
          <a href="#" class="nav-link active" data-section="pacientes"
            >Gestión de Pacientes</a
          >
        </li>
        <li class="nav-item mb-2">
          <a href="#" class="nav-link" data-section="turnos"
            >Agenda de Turnos</a
          >
        </li>
        <li class="nav-item mb-2">
          <a href="#" class="nav-link" data-section="caja">Caja</a>
        </li>
      </ul>
    </nav>

    <!-- Contenido principal a la derecha -->
    <main id="mainContent">
      <h1 class="mb-4">Gestión de Pacientes</h1>

      <form id="formPaciente" class="row g-3 mb-4">
        <div class="col-md-6">
          <label for="apellido" class="form-label">Apellido *</label>
          <input type="text" class="form-control" id="apellido" required />
        </div>
        <div class="col-md-6">
          <label for="nombre" class="form-label">Nombre *</label>
          <input type="text" class="form-control" id="nombre" required />
        </div>
        <div class="col-md-4">
          <label for="dni" class="form-label">DNI *</label>
          <input type="text" class="form-control" id="dni" required />
        </div>
        <div class="col-md-4">
          <label for="telefono" class="form-label">Número de Teléfono *</label>
          <input type="tel" class="form-control" id="telefono" required />
        </div>
        <div class="col-md-4">
          <label for="genero" class="form-label">Género</label>
          <select class="form-select" id="genero">
            <option value="" selected>Seleccionar</option>
            <option value="Masculino">Masculino</option>
            <option value="Femenino">Femenino</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div class="col-md-6">
          <label for="direccion" class="form-label">Dirección</label>
          <input type="text" class="form-control" id="direccion" />
        </div>
        <div class="col-md-6">
          <label for="obraSocial" class="form-label">Obra Social</label>
          <input type="text" class="form-control" id="obraSocial" />
        </div>
        <div class="col-md-6">
          <label for="fechaNacimiento" class="form-label"
            >Fecha de Nacimiento</label
          >
          <input type="date" class="form-control" id="fechaNacimiento" />
        </div>
        <div class="col-12">
          <button type="submit" class="btn btn-primary">
            Guardar Paciente
          </button>
        </div>
      </form>

      <table class="table table-striped">
        <thead>
          <tr>
            <th>Apellido</th>
            <th>Nombre</th>
            <th>DNI</th>
            <th>Teléfono</th>
            <th>Dirección</th>
            <th>Obra Social</th>
            <th>Género</th>
            <th>Fecha Nac.</th>
          </tr>
        </thead>
        <tbody id="tablaPacientes"></tbody>
      </table>
    </main>

    <script type="module" src="script.js"></script>
  </body>
</html>
