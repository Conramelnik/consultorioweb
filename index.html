<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Consultorio Médico - Gestión</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />

    <!-- FullCalendar CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.css"
      rel="stylesheet"
    />

    <style>
      body,
      html {
        height: 100%;
      }
      #sidebar {
        width: 250px;
      }
    </style>
  </head>
  <body>
    <div class="d-flex vh-100">
      <!-- Sidebar -->
      <nav id="sidebar" class="bg-light border-end p-3">
        <h3>Consultorio</h3>
        <ul class="nav nav-pills flex-column">
          <li class="nav-item mb-2">
            <a href="#" class="nav-link active" data-section="inicio">Inicio</a>
          </li>
          <li class="nav-item mb-2">
            <a href="#" class="nav-link" data-section="pacientes">Pacientes</a>
          </li>
          <li class="nav-item mb-2">
            <a href="#" class="nav-link" data-section="turnos">Turnos</a>
          </li>
          <li class="nav-item mb-2">
            <a href="#" class="nav-link" data-section="caja">Caja</a>
          </li>
        </ul>
      </nav>

      <!-- Main content -->
      <main id="mainContent" class="flex-grow-1 p-4 overflow-auto"></main>
    </div>

    <!-- Modal ficha paciente -->
    <!-- Modal ficha paciente -->
    <div
      class="modal fade"
      id="modalFichaPaciente"
      tabindex="-1"
      aria-labelledby="modalFichaPacienteLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-lg modal-dialog-scrollable">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title" id="modalFichaPacienteLabel">
              Ficha del Paciente
            </h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
              aria-label="Cerrar"
            ></button>
          </div>

          <div
            class="modal-body p-3"
            style="max-height: 70vh; overflow-y: auto"
          >
            <!-- Datos básicos en filas alineadas -->
            <!-- DATOS PACIENTE MODAL VER FICHA -->
            <div class="row mb-3 gx-3 gy-2">
              <!-- Fila 1 -->
              <div class="col-md-4">
                <label class="form-label fw-semibold">Apellido</label>
                <p id="fichaApellido" class="mb-0"></p>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Nombre</label>
                <p id="fichaNombre" class="mb-0"></p>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">DNI</label>
                <p id="fichaDNI" class="mb-0"></p>
              </div>

              <!-- Fila 2 -->
              <div class="col-md-4">
                <label class="form-label fw-semibold">Fecha Nac.</label>
                <p id="fichaFechaNacimiento" class="mb-0"></p>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Teléfono</label>
                <p id="fichaTelefono" class="mb-0"></p>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Género</label>
                <p id="fichaGenero" class="mb-0"></p>
              </div>

              <!-- Fila 3 -->
              <div class="col-md-4">
                <label class="form-label fw-semibold">Dirección</label>
                <p id="fichaDireccion" class="mb-0"></p>
              </div>
              <div class="col-md-4">
                <label class="form-label fw-semibold">Obra Social</label>
                <p id="fichaObraSocial" class="mb-0"></p>
              </div>
              <div class="col-md-4">
                <!-- Espacio vacío para alinear columnas -->
              </div>
            </div>

            <!-- Pestañas para secciones -->
            <ul class="nav nav-tabs" id="fichaTabs" role="tablist">
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link active"
                  id="turnos-tab"
                  data-bs-toggle="tab"
                  data-bs-target="#turnos-tab-pane"
                  type="button"
                  role="tab"
                  aria-controls="turnos-tab-pane"
                  aria-selected="true"
                >
                  Turnos
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link"
                  id="pagos-tab"
                  data-bs-toggle="tab"
                  data-bs-target="#pagos-tab-pane"
                  type="button"
                  role="tab"
                  aria-controls="pagos-tab-pane"
                  aria-selected="false"
                >
                  Pagos
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link"
                  id="notas-tab"
                  data-bs-toggle="tab"
                  data-bs-target="#notas-tab-pane"
                  type="button"
                  role="tab"
                  aria-controls="notas-tab-pane"
                  aria-selected="false"
                >
                  Notas
                </button>
              </li>
              <li class="nav-item" role="presentation">
                <button
                  class="nav-link"
                  id="archivos-tab"
                  data-bs-toggle="tab"
                  data-bs-target="#archivos-tab-pane"
                  type="button"
                  role="tab"
                  aria-controls="archivos-tab-pane"
                  aria-selected="false"
                >
                  Archivos
                </button>
              </li>
            </ul>

            <div
              class="tab-content mt-3"
              id="fichaTabsContent"
              style="min-height: 150px"
            >
              <div
                class="tab-pane fade show active"
                id="turnos-tab-pane"
                role="tabpanel"
                aria-labelledby="turnos-tab"
              >
                <ul id="fichaTurnos" class="list-group"></ul>
              </div>
              <div
                class="tab-pane fade"
                id="pagos-tab-pane"
                role="tabpanel"
                aria-labelledby="pagos-tab"
              >
                <ul id="fichaPagos" class="list-group"></ul>
              </div>
              <div
                class="tab-pane fade"
                id="notas-tab-pane"
                role="tabpanel"
                aria-labelledby="notas-tab"
              >
                <ul id="fichaNotas" class="list-group"></ul>
              </div>
              <div
                class="tab-pane fade"
                id="archivos-tab-pane"
                role="tabpanel"
                aria-labelledby="archivos-tab"
              >
                <ul id="fichaArchivos" class="list-group"></ul>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cerrar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal editar turno -->
    <div
      class="modal fade"
      id="modalEditarTurno"
      tabindex="-1"
      aria-labelledby="modalEditarTurnoLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="formEditarTurno">
            <div class="modal-header">
              <h5 class="modal-title" id="modalEditarTurnoLabel">
                Editar Turno
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Cerrar"
              ></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="editarTurnoId" />

              <div class="mb-3">
                <label for="editarFecha" class="form-label">Fecha</label>
                <input
                  type="date"
                  class="form-control"
                  id="editarFecha"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="editarHora" class="form-label">Hora</label>
                <input
                  type="time"
                  class="form-control"
                  id="editarHora"
                  required
                />
              </div>

              <div class="mb-3">
                <label for="editarMonto" class="form-label"
                  >Monto abonado</label
                >
                <input
                  type="number"
                  class="form-control"
                  id="editarMonto"
                  min="0"
                  step="0.01"
                />
                <div id="editarMontoAviso" class="form-text text-muted">
                  Solo si el paciente asistió
                </div>
              </div>
            </div>
            <div class="modal-footer">
              <button type="submit" class="btn btn-primary">
                Guardar cambios
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Tu script principal -->
    <script type="module" src="script.js"></script>

    <!-- Bootstrap JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- FullCalendar JS (global build) -->
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.8/index.global.min.js"></script>
  </body>
</html>
