<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login y Registro con Firebase</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      body {
        background: linear-gradient(135deg, #6a11cb, #2575fc);
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      }
      .card {
        border-radius: 1rem;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        width: 100%;
        max-width: 420px;
        background-color: #fff;
        padding: 2rem;
      }
      h3 {
        color: #333;
        font-weight: 700;
        margin-bottom: 1.5rem;
      }
      .form-label {
        font-weight: 600;
      }
      a {
        cursor: pointer;
        color: #2575fc;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      .alert {
        font-size: 0.9rem;
      }
      button {
        font-weight: 600;
        padding: 0.5rem 0;
        font-size: 1rem;
      }
    </style>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
      import {
        getAuth,
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword,
      } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-auth.js";

      // Tu configuración Firebase
      const firebaseConfig = {
        apiKey: "AIzaSyAQwEe9C-ruCZ6TX612zA6FhkxZUJ2rVoc",
        authDomain: "consultoriosapp-f7f08.firebaseapp.com",
        projectId: "consultoriosapp-f7f08",
        storageBucket: "consultoriosapp-f7f08.firebasestorage.app",
        messagingSenderId: "729983357456",
        appId: "1:729983357456:web:61f5805927509dfeefb095",
      };

      // Inicializar Firebase
      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      window.addEventListener("DOMContentLoaded", () => {
        const loginForm = document.getElementById("loginForm");
        const registerForm = document.getElementById("registerForm");
        const alertBox = document.getElementById("alertBox");
        const alertBoxRegister = document.getElementById("alertBoxRegister");
        const toggleToRegister = document.getElementById("toggleToRegister");
        const toggleToLogin = document.getElementById("toggleToLogin");

        // Mostrar registro y ocultar login
        toggleToRegister.addEventListener("click", () => {
          alertBox.classList.add("d-none");
          alertBoxRegister.classList.add("d-none");
          loginForm.classList.add("d-none");
          registerForm.classList.remove("d-none");
        });

        // Mostrar login y ocultar registro
        toggleToLogin.addEventListener("click", () => {
          alertBox.classList.add("d-none");
          alertBoxRegister.classList.add("d-none");
          registerForm.classList.add("d-none");
          loginForm.classList.remove("d-none");
        });

        // Manejo Login
        loginForm.addEventListener("submit", (e) => {
          e.preventDefault();
          alertBox.classList.add("d-none");

          const email = loginForm.email.value.trim();
          const password = loginForm.password.value.trim();

          signInWithEmailAndPassword(auth, email, password)
            .then(() => {
              // Login exitoso
              window.location.href = "index.html"; // Cambiar a tu página
            })
            .catch((error) => {
              alertBox.textContent = error.message;
              alertBox.classList.remove("d-none");
            });
        });

        // Manejo Registro
        registerForm.addEventListener("submit", (e) => {
          e.preventDefault();
          alertBoxRegister.classList.add("d-none");

          const email = registerForm.email.value.trim();
          const password = registerForm.password.value.trim();
          const passwordConfirm = registerForm.passwordConfirm.value.trim();

          if (password !== passwordConfirm) {
            alertBoxRegister.textContent = "Las contraseñas no coinciden";
            alertBoxRegister.classList.remove("d-none");
            return;
          }

          createUserWithEmailAndPassword(auth, email, password)
            .then(() => {
              alert("Cuenta creada con éxito. Ahora podés iniciar sesión.");
              registerForm.reset();
              toggleToLogin.click();
            })
            .catch((error) => {
              alertBoxRegister.textContent = error.message;
              alertBoxRegister.classList.remove("d-none");
            });
        });
      });
    </script>
  </head>
  <body>
    <div class="card">
      <h3 class="text-center">Iniciar Sesión</h3>

      <!-- Formulario Login -->
      <form id="loginForm">
        <div id="alertBox" class="alert alert-danger d-none"></div>

        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-control"
            required
            placeholder="tu@email.com"
          />
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            required
            placeholder="Contraseña"
          />
        </div>

        <button type="submit" class="btn btn-primary w-100 mb-3">Entrar</button>

        <div class="text-center">
          ¿No tenés cuenta? <a id="toggleToRegister">Registrate</a>
        </div>
      </form>

      <!-- Formulario Registro -->
      <form id="registerForm" class="d-none">
        <div id="alertBoxRegister" class="alert alert-danger d-none"></div>

        <div class="mb-3">
          <label for="emailRegister" class="form-label"
            >Correo electrónico</label
          >
          <input
            type="email"
            id="emailRegister"
            name="email"
            class="form-control"
            required
            placeholder="tu@email.com"
          />
        </div>

        <div class="mb-3">
          <label for="passwordRegister" class="form-label">Contraseña</label>
          <input
            type="password"
            id="passwordRegister"
            name="password"
            class="form-control"
            required
            placeholder="Contraseña"
          />
        </div>

        <div class="mb-3">
          <label for="passwordConfirm" class="form-label"
            >Confirmar contraseña</label
          >
          <input
            type="password"
            id="passwordConfirm"
            name="passwordConfirm"
            class="form-control"
            required
            placeholder="Confirmar contraseña"
          />
        </div>

        <button type="submit" class="btn btn-success w-100 mb-3">
          Crear cuenta
        </button>

        <div class="text-center">
          ¿Ya tenés cuenta? <a id="toggleToLogin">Iniciar sesión</a>
        </div>
      </form>
    </div>
  </body>
</html>
