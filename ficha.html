<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ficha del Paciente</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      #imagenModal {
        cursor: zoom-in;
        transition: transform 0.25s ease;
        max-width: 100%;
        max-height: 70vh;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <button id="btnVolver" class="btn btn-secondary mb-3">
        <i class="bi bi-arrow-left"></i> Volver
      </button>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Ficha del Paciente</h2>
        <button id="btnRefrescarFicha" class="btn btn-outline-primary">
          <i class="bi bi-arrow-clockwise"></i> Refrescar ficha
        </button>
      </div>

      <hr />

      <div id="infoPaciente" class="mb-4"></div>

      <ul class="nav nav-tabs" id="fichaTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="datos-tab"
            data-bs-toggle="tab"
            data-bs-target="#datos"
            type="button"
            role="tab"
          >
            Datos Personales
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="historia-tab"
            data-bs-toggle="tab"
            data-bs-target="#historia"
            type="button"
            role="tab"
          >
            Historia Clínica
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="turnos-tab"
            data-bs-toggle="tab"
            data-bs-target="#turnos"
            type="button"
            role="tab"
          >
            Turnos
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="pagos-tab"
            data-bs-toggle="tab"
            data-bs-target="#pagos"
            type="button"
            role="tab"
          >
            Pagos
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="imagenes-tab"
            data-bs-toggle="tab"
            data-bs-target="#imagenes"
            type="button"
            role="tab"
          >
            Imágenes y Placas
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="recetas-tab"
            data-bs-toggle="tab"
            data-bs-target="#recetas"
            type="button"
            role="tab"
          >
            Recetas Médicas
          </button>
        </li>
        <!-- NUEVA PESTAÑA PRESUPUESTOS -->
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="presupuestos-tab"
            data-bs-toggle="tab"
            data-bs-target="#presupuestos"
            type="button"
            role="tab"
          >
            Presupuestos
          </button>
        </li>
      </ul>

      <div class="tab-content mt-3" id="fichaTabsContent">
        <div
          class="tab-pane fade show active"
          id="datos"
          role="tabpanel"
          tabindex="0"
        >
          <div id="datosPaciente"></div>
        </div>

        <div class="tab-pane fade" id="historia" role="tabpanel" tabindex="0">
          <div class="mb-3">
            <label for="selectTurnoParaNota" class="form-label">Turno:</label>
            <select id="selectTurnoParaNota" class="form-select"></select>
          </div>
          <div class="mb-3">
            <label for="inputTextoNota" class="form-label">Nota Clínica:</label>
            <textarea
              id="inputTextoNota"
              class="form-control"
              rows="4"
            ></textarea>
          </div>
          <button id="btnAgregarNota" class="btn btn-primary mb-4">
            Guardar Nota
          </button>
          <h5>Notas anteriores</h5>
          <ul id="listaNotasClinicas" class="list-group"></ul>
        </div>

        <div class="tab-pane fade" id="turnos" role="tabpanel" tabindex="0">
          <ul id="listaTurnosPaciente" class="list-group"></ul>
        </div>

        <div class="tab-pane fade" id="pagos" role="tabpanel" tabindex="0">
          <ul id="listaPagosPaciente" class="list-group"></ul>
        </div>

        <div class="tab-pane fade" id="imagenes" role="tabpanel" tabindex="0">
          <div class="mb-3">
            <label for="inputImagen" class="form-label"
              >Seleccionar imagen/placa:</label
            >
            <input
              type="file"
              id="inputImagen"
              class="form-control"
              accept="image/*"
            />
          </div>
          <div class="mb-3">
            <label for="inputDescripcionImagen" class="form-label"
              >Descripción:</label
            >
            <textarea
              id="inputDescripcionImagen"
              class="form-control"
              rows="2"
              placeholder="Escribí una descripción para la imagen"
            ></textarea>
          </div>
          <button id="btnSubirImagen" class="btn btn-success mb-3">
            Subir imagen
          </button>

          <div id="listaImagenes" class="row g-3"></div>
        </div>

        <!-- Modal para imagen ampliada -->
        <div
          class="modal fade"
          id="modalImagenAmpliada"
          tabindex="-1"
          aria-labelledby="modalImagenAmpliadaLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="modalImagenAmpliadaLabel">
                  IMAGEN AMPLIADA
                </h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Cerrar"
                ></button>
              </div>
              <div class="modal-body text-center">
                <img
                  id="imagenModal"
                  src=""
                  alt="Imagen ampliada"
                  class="img-fluid"
                />
                <p id="descripcionModal" class="mt-3"></p>
                <small id="fechaModal" class="text-muted"></small>
              </div>
            </div>
          </div>
        </div>

        <div class="tab-pane fade" id="recetas" role="tabpanel" tabindex="0">
          <div class="mb-3">
            <label for="inputRecetaTexto" class="form-label"
              >Escribir receta médica:</label
            >
            <textarea
              id="inputRecetaTexto"
              class="form-control"
              rows="4"
            ></textarea>
          </div>
          <button id="btnGuardarReceta" class="btn btn-primary mb-3">
            Guardar Receta
          </button>
          <h5>Recetas anteriores</h5>
          <ul id="listaRecetas" class="list-group"></ul>
        </div>

        <!-- NUEVA TAB: PRESUPUESTOS -->
        <div
          class="tab-pane fade"
          id="presupuestos"
          role="tabpanel"
          tabindex="0"
        >
          <div class="p-3">
            <h5>Presupuestos del paciente</h5>
            <div id="listaPresupuestosPaciente" class="mt-3"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
      import {
        getFirestore,
        doc,
        getDoc,
        getDocs,
        query,
        collection,
        addDoc,
        orderBy,
        deleteDoc,
      } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

      // Firebase Config
      const firebaseConfig = {
        apiKey: "AIzaSyAQwEe9C-ruCZ6TX612zA6FhkxZUJ2rVoc",
        authDomain: "consultoriosapp-f7f08.firebaseapp.com",
        projectId: "consultoriosapp-f7f08",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const idPacienteGlobal = new URLSearchParams(location.search).get("id");
      if (!idPacienteGlobal) {
        alert("No se especificó paciente");
        throw new Error("No se especificó paciente");
      }

      let apellidoPaciente = "",
        nombrePaciente = "";

      // Carga datos personales del paciente
      async function cargarDatosPaciente() {
        const docRef = doc(db, "pacientes", idPacienteGlobal);
        const docSnap = await getDoc(docRef);
        if (!docSnap.exists()) {
          alert("Paciente no encontrado");
          return;
        }
        const paciente = docSnap.data();

        apellidoPaciente = paciente.apellido?.toLowerCase().trim() || "";
        nombrePaciente = paciente.nombre?.toLowerCase().trim() || "";

        document.getElementById("datosPaciente").innerHTML = `
          <p><strong>Apellido:</strong> ${paciente.apellido || "-"}</p>
          <p><strong>Nombre:</strong> ${paciente.nombre || "-"}</p>
          <p><strong>DNI:</strong> ${paciente.dni || "-"}</p>
          <p><strong>Teléfono:</strong> ${paciente.telefono || "-"}</p>
          <p><strong>Dirección:</strong> ${paciente.direccion || "-"}</p>
          <p><strong>Género:</strong> ${paciente.genero || "-"}</p>
          <p><strong>Obra Social:</strong> ${paciente.obraSocial || "-"}</p>
          <p><strong>Fecha Nac.:</strong> ${paciente.fechaNacimiento || "-"}</p>
          <p><strong>Ingreso:</strong> ${paciente.fechaIngreso || "-"}</p>
        `;
      }

      // Función para cargar turnos en el select para notas clínicas
      async function cargarTurnosParaSelect() {
        const q = query(collection(db, "turnos"), orderBy("fecha", "desc"));
        const snapshot = await getDocs(q);
        const select = document.getElementById("selectTurnoParaNota");
        select.innerHTML = "";

        const turnosPaciente = [];
        snapshot.forEach((docu) => {
          const turno = docu.data();
          if (String(turno.pacienteId) === idPacienteGlobal) {
            turnosPaciente.push({ id: docu.id, ...turno });
          }
        });

        if (turnosPaciente.length === 0) {
          const option = document.createElement("option");
          option.textContent = "No hay turnos disponibles";
          option.disabled = true;
          option.value = "";
          select.appendChild(option);
          return;
        }

        turnosPaciente.forEach((turno) => {
          const option = document.createElement("option");
          option.value = turno.id;
          option.textContent = `${turno.fecha} ${turno.hora} - ${
            turno.tipoConsulta || "-"
          }`;
          select.appendChild(option);
        });
      }

      // Cargar notas clínicas
      async function cargarNotas() {
        const q = query(
          collection(db, "notasClinicas"),
          orderBy("fechaCreacion", "desc")
        );
        const snapshot = await getDocs(q);
        const lista = document.getElementById("listaNotasClinicas");
        lista.innerHTML = "";

        const notasPaciente = [];
        snapshot.forEach((docu) => {
          const nota = docu.data();
          if (nota.idPaciente === idPacienteGlobal) {
            notasPaciente.push(nota);
          }
        });

        if (notasPaciente.length === 0) {
          lista.innerHTML =
            "<li class='list-group-item'>No hay notas clínicas registradas.</li>";
          return;
        }

        notasPaciente.forEach((nota) => {
          const li = document.createElement("li");
          li.className = "list-group-item";
          li.innerHTML = `<strong>${nota.fechaTurno} ${nota.horaTurno}</strong><br>${nota.notaTexto}`;
          lista.appendChild(li);
        });
      }

      // Agregar nota clínica
      async function agregarNota(idTurno, notaTexto) {
        const turnoDoc = await getDoc(doc(db, "turnos", idTurno));
        if (!turnoDoc.exists()) {
          alert("Turno no encontrado");
          return;
        }
        const turno = turnoDoc.data();

        await addDoc(collection(db, "notasClinicas"), {
          idPaciente: idPacienteGlobal,
          idTurno,
          fechaTurno: turno.fecha,
          horaTurno: turno.hora,
          notaTexto,
          fechaCreacion: new Date().toISOString(),
          doctor: "Dr. Pérez",
        });
      }

      // Cargar turnos del paciente
      // Cargar turnos del paciente
      async function cargarTurnos() {
        // Función para cargar presupuestos del paciente y mostrarlos en la ficha
        // Función para cargar presupuestos del paciente y mostrarlos en la ficha

        const lista = document.getElementById("listaTurnosPaciente");
        lista.innerHTML = "";

        try {
          const q = query(collection(db, "turnos"), orderBy("fecha", "desc"));
          const snapshot = await getDocs(q);

          const turnosPaciente = [];

          snapshot.forEach((docu) => {
            const turno = docu.data();
            if (String(turno.pacienteId) === idPacienteGlobal) {
              turnosPaciente.push(turno);
            }
          });

          if (turnosPaciente.length === 0) {
            lista.innerHTML =
              "<li class='list-group-item'>No hay turnos registrados.</li>";
            return;
          }

          turnosPaciente.forEach((turno) => {
            const {
              fecha = "-",
              hora = "-",
              tipoConsulta = "-",
              estado = "",
              asistio,
              montoAbonado = 0,
            } = turno;

            let estadoAMostrar = "";

            if (estado && estado !== "") {
              estadoAMostrar = estado; // "Cancelado", "Ausente", etc.
            } else if (asistio === true) {
              estadoAMostrar = "Asistió";
            } else if (asistio === false) {
              estadoAMostrar = "No asistió";
            } else {
              estadoAMostrar = "Sin estado";
            }

            const li = document.createElement("li");
            li.className = "list-group-item";
            li.innerHTML = `
        <strong>${fecha} ${hora}</strong> - ${tipoConsulta}<br>
        Estado: ${estadoAMostrar}<br>
        Monto abonado: $${montoAbonado.toFixed(2)}
      `;
            lista.appendChild(li);
          });
        } catch (error) {
          lista.innerHTML = `<li class='list-group-item text-danger'>Error al cargar turnos.</li>`;
          console.error("Error al cargar turnos:", error);
        }
      }
      async function cargarPresupuestosPaciente() {
        const contenedor = document.getElementById("listaPresupuestosPaciente");
        contenedor.innerHTML = "Cargando presupuestos...";

        try {
          const q = query(
            collection(db, "presupuestos"),
            orderBy("fechaCreacion", "desc") // Cambié a fechaCreacion, porque es el campo que tienes
          );
          const snapshot = await getDocs(q);

          const presupuestos = [];
          snapshot.forEach((docu) => {
            const presupuesto = docu.data();
            if (
              String(presupuesto.pacienteId).trim() ===
              String(idPacienteGlobal).trim()
            ) {
              presupuestos.push({ id: docu.id, ...presupuesto });
            }
          });

          if (presupuestos.length === 0) {
            contenedor.innerHTML =
              "<p>No hay presupuestos registrados para este paciente.</p>";
            return;
          }

          contenedor.innerHTML = ""; // limpio

          presupuestos.forEach((presu) => {
            const html = `
        <div class="card mb-3 p-3">
          <strong>Fecha:</strong> ${presu.fechaCreacion || "-"}<br>
          <strong>Tratamiento:</strong> ${presu.tratamiento || "-"}<br>
          <strong>Total:</strong> $${presu.total?.toFixed(2) || "0.00"}<br>
          <strong>Cuotas:</strong> ${presu.cuotas || "-"}<br>
          <strong>Monto por cuota:</strong> $${
            presu.montoPorCuota?.toFixed(2) || "0.00"
          }<br>
          <strong>Estado:</strong> ${presu.estado || "Pendiente"}
        </div>
      `;
            contenedor.insertAdjacentHTML("beforeend", html);
          });
        } catch (error) {
          contenedor.innerHTML = `<p class="text-danger">Error al cargar presupuestos.</p>`;
          console.error("Error al cargar presupuestos:", error);
        }
      }

      // Cargar pagos del paciente
      async function cargarPagos() {
        const snapshot = await getDocs(collection(db, "caja"));
        const lista = document.getElementById("listaPagosPaciente");
        lista.innerHTML = "";

        const nombreCompleto = `${apellidoPaciente} ${nombrePaciente}`.trim();
        const pagos = [];

        snapshot.forEach((docu) => {
          const pago = docu.data();
          if (
            pago.pacienteNombre?.toLowerCase().trim() ===
            nombreCompleto.toLowerCase()
          ) {
            pagos.push(pago);
          }
        });

        if (pagos.length === 0) {
          lista.innerHTML =
            "<li class='list-group-item'>No hay pagos registrados.</li>";
          return;
        }

        pagos.forEach((p) => {
          const li = document.createElement("li");
          li.className = "list-group-item";
          li.innerHTML = `<strong>${p.fecha}</strong> - $${p.monto.toFixed(
            2
          )}<br>${p.tipoConsulta || "-"}`;
          lista.appendChild(li);
        });
      }

      document
        .getElementById("btnVolver")
        .addEventListener("click", () => window.close());

      (async () => {
        await cargarDatosPaciente();
        await Promise.all([
          cargarTurnosParaSelect(),
          cargarTurnos(),
          cargarNotas(),
          cargarPagos(),
          cargarImagenesPaciente(),
          cargarPresupuestosPaciente(), // <--- agregalo acá
        ]);
      })();

      document
        .getElementById("btnAgregarNota")
        .addEventListener("click", async () => {
          const idTurno = document.getElementById("selectTurnoParaNota").value;
          const texto = document.getElementById("inputTextoNota").value.trim();
          if (!idTurno || !texto) {
            alert("Seleccioná un turno y escribí la nota.");
            return;
          }
          await agregarNota(idTurno, texto);
          await cargarNotas();
          document.getElementById("inputTextoNota").value = "";
          alert("Nota guardada.");
        });

      async function refrescarFicha() {
        await cargarDatosPaciente();
        await Promise.all([
          cargarTurnosParaSelect(),
          cargarTurnos(),
          cargarNotas(),
          cargarPagos(),
          cargarImagenesPaciente(),
        ]);
      }

      document
        .getElementById("btnRefrescarFicha")
        .addEventListener("click", async () => {
          await refrescarFicha();
          alert("Ficha actualizada");
        });

      // ----------- IMÁGENES Y PLACAS con Cloudinary -----------

      document
        .getElementById("btnSubirImagen")
        .addEventListener("click", async () => {
          const fileInput = document.getElementById("inputImagen");
          const file = fileInput.files[0];
          if (!file) {
            alert("Seleccioná una imagen primero.");
            return;
          }

          const descripcionInput = document.getElementById(
            "inputDescripcionImagen"
          );
          const descripcion = descripcionInput.value.trim();

          const fechaSubida = new Date().toISOString();

          const formData = new FormData();
          formData.append("file", file);
          formData.append("upload_preset", "consultorio_unsigned"); // Tu upload preset aquí
          formData.append("folder", "consultorio"); // opcional, para organizar en Cloudinary

          try {
            const res = await fetch(
              "https://api.cloudinary.com/v1_1/dcljeqcng/image/upload",
              {
                method: "POST",
                body: formData,
              }
            );

            const data = await res.json();

            if (!res.ok) {
              throw new Error(data.error?.message || "Error al subir imagen");
            }

            const urlCloudinary = data.secure_url;

            await addDoc(collection(db, "imagenesPacientes"), {
              idPaciente: idPacienteGlobal,
              url: urlCloudinary,
              descripcion: descripcion || "",
              fecha: fechaSubida,
            });

            alert("Imagen subida con éxito.");
            fileInput.value = "";
            descripcionInput.value = "";
            cargarImagenesPaciente();
          } catch (error) {
            console.error("Error al subir imagen a Cloudinary:", error);
            alert("Error al subir imagen. Revisa la consola.");
          }
        });

      async function cargarImagenesPaciente() {
        try {
          const lista = document.getElementById("listaImagenes");
          lista.innerHTML = "";

          const q = query(
            collection(db, "imagenesPacientes"),
            orderBy("fecha", "desc")
          );
          const snapshot = await getDocs(q);

          const imagenes = [];

          snapshot.forEach((docu) => {
            const img = docu.data();
            img.id = docu.id;
            if (String(img.idPaciente) === String(idPacienteGlobal)) {
              imagenes.push(img);
            }
          });

          if (imagenes.length === 0) {
            lista.innerHTML =
              "<p class='text-muted'>No hay imágenes subidas.</p>";
            return;
          }

          imagenes.forEach((img) => {
            const col = document.createElement("div");
            col.className = "col-md-4";
            col.style.position = "relative";

            col.innerHTML = `
        <div class="card mb-3">
          <img src="${
            img.url
          }" class="card-img-top" alt="Imagen del paciente" style="cursor:pointer;" />
          <div class="card-body">
            <p class="card-text">${img.descripcion || "(Sin descripción)"}</p>
            <small class="text-muted">${new Date(
              img.fecha
            ).toLocaleString()}</small>
          </div>
          <button class="btn btn-danger btn-sm btn-eliminar-imagen" style="
            position: absolute;
            top: 5px;
            right: 5px;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            padding: 0;
            line-height: 22px;
            font-weight: bold;
            text-align: center;
            cursor: pointer;
          ">×</button>
        </div>
      `;

            col.querySelector("img").addEventListener("click", () => {
              document.getElementById("imagenModal").src = img.url;
              document.getElementById("descripcionModal").textContent =
                img.descripcion || "(Sin descripción)";
              document.getElementById("fechaModal").textContent = new Date(
                img.fecha
              ).toLocaleString();

              const modal = new bootstrap.Modal(
                document.getElementById("modalImagenAmpliada")
              );
              modal.show();
            });

            col
              .querySelector(".btn-eliminar-imagen")
              .addEventListener("click", async () => {
                if (
                  !confirm(
                    "¿Querés eliminar esta imagen? Esta acción no se puede deshacer."
                  )
                )
                  return;

                console.log("Intentando eliminar imagen con id:", img.id);
                try {
                  await deleteDoc(doc(db, "imagenesPacientes", img.id));
                  alert("Imagen eliminada correctamente.");
                  cargarImagenesPaciente();
                } catch (error) {
                  console.error("Error al eliminar imagen:", error);
                  alert("No se pudo eliminar la imagen. Revisa la consola.");
                }
              });

            lista.appendChild(col);
          });
        } catch (error) {
          console.error("Error en cargarImagenesPaciente:", error);
        }
      }

      // ----------- RECETAS (simulación, guardar en memoria) -----------

      let recetasGuardadas = [];

      document
        .getElementById("btnGuardarReceta")
        .addEventListener("click", () => {
          const texto = document
            .getElementById("inputRecetaTexto")
            .value.trim();
          if (!texto) {
            alert("Escribí una receta");
            return;
          }

          const receta = {
            texto,
            fecha: new Date().toLocaleDateString(),
          };
          recetasGuardadas.unshift(receta);

          const li = document.createElement("li");
          li.className = "list-group-item";
          li.innerHTML = `<strong>${receta.fecha}</strong><br>${receta.texto}`;
          document.getElementById("listaRecetas").prepend(li);

          document.getElementById("inputRecetaTexto").value = "";
          alert("Receta guardada");
        });

      const imagenModal = document.getElementById("imagenModal");

      let escala = 1;

      imagenModal.addEventListener("wheel", (e) => {
        e.preventDefault();

        const delta = e.deltaY > 0 ? -0.1 : 0.1; // scroll abajo = zoom out, scroll arriba = zoom in
        escala += delta;

        if (escala < 1) escala = 1; // no puede ser menor que 1 (no hacer zoom menor a tamaño original)
        if (escala > 5) escala = 5; // máximo 5x zoom

        imagenModal.style.transform = `scale(${escala})`;
      });

      // Reseteamos el zoom cuando cerramos el modal
      const modalImagen = document.getElementById("modalImagenAmpliada");
      modalImagen.addEventListener("hidden.bs.modal", () => {
        escala = 1;
        imagenModal.style.transform = "scale(1)";
      });
    </script>
  </body>
</html>
