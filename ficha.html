<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ficha del Paciente</title>

    <!-- Bootstrap CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <style>
      #imagenModal {
        cursor: zoom-in;
        transition: transform 0.25s ease;
        max-width: 100%;
        max-height: 70vh;
      }
    </style>
  </head>
  <body class="bg-light">
    <div class="container py-4">
      <button id="btnVolver" class="btn btn-secondary mb-3">
        <i class="bi bi-arrow-left"></i> Volver
      </button>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Ficha del Paciente</h2>
        <button id="btnRefrescarFicha" class="btn btn-outline-primary">
          <i class="bi bi-arrow-clockwise"></i> Refrescar ficha
        </button>
      </div>

      <div id="infoPaciente" class="mb-4"></div>

      <!-- Nav tabs -->
      <ul class="nav nav-tabs" id="fichaTabs" role="tablist">
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active"
            id="datos-tab"
            data-bs-toggle="tab"
            data-bs-target="#datos"
            type="button"
            role="tab"
          >
            Datos Personales
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="historia-tab"
            data-bs-toggle="tab"
            data-bs-target="#historia"
            type="button"
            role="tab"
          >
            Historia Clínica
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="turnos-tab"
            data-bs-toggle="tab"
            data-bs-target="#turnos"
            type="button"
            role="tab"
          >
            Turnos
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="pagos-tab"
            data-bs-toggle="tab"
            data-bs-target="#pagos"
            type="button"
            role="tab"
          >
            Pagos
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="imagenes-tab"
            data-bs-toggle="tab"
            data-bs-target="#imagenes"
            type="button"
            role="tab"
          >
            Imágenes y Placas
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="recetas-tab"
            data-bs-toggle="tab"
            data-bs-target="#recetas"
            type="button"
            role="tab"
          >
            Recetas Médicas
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link"
            id="presupuestos-tab"
            data-bs-toggle="tab"
            data-bs-target="#presupuestos"
            type="button"
            role="tab"
          >
            Presupuestos
          </button>
        </li>
      </ul>

      <!-- Tab panes -->
      <div class="tab-content mt-3" id="fichaTabsContent">
        <!-- SECCIÓN: Datos Personales -->
        <div
          class="tab-pane fade show active"
          id="datos"
          role="tabpanel"
          tabindex="0"
        >
          <div id="datosPaciente"></div>
        </div>

        <!-- SECCIÓN: Historia Clínica -->
        <div class="tab-pane fade" id="historia" role="tabpanel" tabindex="0">
          <div class="mb-3">
            <label for="selectTurnoParaNota" class="form-label">Turno:</label>
            <select id="selectTurnoParaNota" class="form-select"></select>
          </div>
          <div class="mb-3">
            <label for="inputTextoNota" class="form-label">Nota Clínica:</label>
            <textarea
              id="inputTextoNota"
              class="form-control"
              rows="4"
            ></textarea>
          </div>
          <button id="btnAgregarNota" class="btn btn-primary mb-4">
            Guardar Nota
          </button>
          <h5>Notas anteriores</h5>
          <ul id="listaNotasClinicas" class="list-group"></ul>
        </div>

        <!-- SECCIÓN: Turnos -->
        <div class="tab-pane fade" id="turnos" role="tabpanel" tabindex="0">
          <ul id="listaTurnosPaciente" class="list-group"></ul>
        </div>

        <!-- SECCIÓN: Pagos -->
        <div class="tab-pane fade" id="pagos" role="tabpanel" tabindex="0">
          <ul id="listaPagosPaciente" class="list-group"></ul>
        </div>

        <!-- SECCIÓN: Imágenes y Placas -->
        <div class="tab-pane fade" id="imagenes" role="tabpanel" tabindex="0">
          <div class="mb-3">
            <label for="inputImagen" class="form-label"
              >Seleccionar imagen/placa:</label
            >
            <input
              type="file"
              id="inputImagen"
              class="form-control"
              accept="image/*"
            />
          </div>
          <div class="mb-3">
            <label for="inputDescripcionImagen" class="form-label"
              >Descripción:</label
            >
            <textarea
              id="inputDescripcionImagen"
              class="form-control"
              rows="2"
              placeholder="Escribí una descripción para la imagen"
            ></textarea>
          </div>
          <button id="btnSubirImagen" class="btn btn-success mb-3">
            Subir imagen
          </button>

          <div id="listaImagenes" class="row g-3"></div>
        </div>

        <!-- Modal para imagen ampliada -->
        <div
          class="modal fade"
          id="modalImagenAmpliada"
          tabindex="-1"
          aria-labelledby="modalImagenAmpliadaLabel"
          aria-hidden="true"
        >
          <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
              <div class="modal-header">
                <h5 class="modal-title" id="modalImagenAmpliadaLabel">
                  IMAGEN AMPLIADA
                </h5>
                <button
                  type="button"
                  class="btn-close"
                  data-bs-dismiss="modal"
                  aria-label="Cerrar"
                ></button>
              </div>
              <div class="modal-body text-center">
                <img
                  id="imagenModal"
                  src=""
                  alt="Imagen ampliada"
                  class="img-fluid"
                />
                <p id="descripcionModal" class="mt-3"></p>
                <small id="fechaModal" class="text-muted"></small>
              </div>
            </div>
          </div>
        </div>

        <!-- SECCIÓN: Recetas Médicas -->
        <div class="tab-pane fade" id="recetas" role="tabpanel" tabindex="0">
          <div class="mb-3">
            <label for="inputRecetaTexto" class="form-label"
              >Escribir receta médica:</label
            >
            <textarea
              id="inputRecetaTexto"
              class="form-control"
              rows="4"
            ></textarea>
          </div>
          <button id="btnGuardarReceta" class="btn btn-primary mb-3">
            Guardar Receta
          </button>
          <h5>Recetas anteriores</h5>
          <ul id="listaRecetas" class="list-group"></ul>
        </div>

        <!-- SECCIÓN: Presupuestos -->
        <div
          class="tab-pane fade"
          id="presupuestos"
          role="tabpanel"
          tabindex="0"
        >
          <div class="p-3">
            <div class="d-flex justify-content-between align-items-center mb-4">
              <h4 class="fw-bold text-primary mb-0">
                PRESUPUESTOS DEL PACIENTE
              </h4>
              <button
                class="btn btn-primary rounded-pill px-4 py-2 fw-semibold shadow-sm"
                id="btnAbrirNuevoPresupuesto"
              >
                + Nuevo Presupuesto
              </button>
            </div>

            <div id="listaPresupuestosPaciente" class="d-flex gap-3 flex-wrap">
              <!-- Aquí se insertarán las cards de resumen y tabla dinámicamente -->
            </div>

            <!-- Modal para ingresar pago parcial -->
            <div
              class="modal fade"
              id="modalPagoParcial"
              tabindex="-1"
              aria-labelledby="modalPagoParcialLabel"
              aria-hidden="true"
            >
              <div class="modal-dialog">
                <div class="modal-content">
                  <div class="modal-header">
                    <h5 class="modal-title" id="modalPagoParcialLabel">
                      Registrar Pago Parcial
                    </h5>
                    <button
                      type="button"
                      class="btn-close"
                      data-bs-dismiss="modal"
                      aria-label="Cerrar"
                    ></button>
                  </div>
                  <div class="modal-body">
                    <form id="formPagoParcial">
                      <input type="hidden" id="inputPresupuestoId" />
                      <input type="hidden" id="inputCuotaNumero" />
                      <div class="mb-3">
                        <label for="inputFechaPago" class="form-label"
                          >Fecha de Pago</label
                        >
                        <input
                          type="date"
                          id="inputFechaPago"
                          class="form-control"
                          required
                        />
                      </div>
                      <div class="mb-3">
                        <label for="inputMontoPago" class="form-label"
                          >Monto</label
                        >
                        <input
                          type="number"
                          step="0.01"
                          min="0"
                          id="inputMontoPago"
                          class="form-control"
                          required
                        />
                      </div>
                      <div class="mb-3">
                        <label for="inputMetodoPago" class="form-label"
                          >Método de Pago</label
                        >
                        <select
                          id="inputMetodoPago"
                          class="form-select"
                          required
                        >
                          <option value="">Seleccione...</option>
                          <option value="Efectivo">Efectivo</option>
                          <option value="Tarjeta">Tarjeta</option>
                          <option value="Transferencia">Transferencia</option>
                          <option value="Otro">Otro</option>
                        </select>
                      </div>
                      <button type="submit" class="btn btn-primary">
                        Guardar Pago
                      </button>
                    </form>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal para crear nuevo presupuesto -->
    <div
      class="modal fade"
      id="modalNuevoPresupuesto"
      tabindex="-1"
      aria-labelledby="modalNuevoPresupuestoLabel"
      aria-hidden="true"
    >
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="formNuevoPresupuesto">
            <div class="modal-header">
              <h5 class="modal-title" id="modalNuevoPresupuestoLabel">
                Nuevo Presupuesto
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Cerrar"
              ></button>
            </div>
            <div class="modal-body">
              <!-- Fecha -->
              <div class="mb-3">
                <label for="inputFechaPresupuesto" class="form-label"
                  >Fecha</label
                >
                <input
                  type="date"
                  class="form-control"
                  id="inputFechaPresupuesto"
                  required
                />
              </div>

              <!-- Tratamiento -->
              <div class="mb-3">
                <label for="inputTratamiento" class="form-label"
                  >Tratamiento</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="inputTratamiento"
                  required
                />
              </div>

              <!-- Monto -->
              <div class="mb-3">
                <label for="inputMontoPresupuesto" class="form-label">
                  Monto Total
                </label>
                <input
                  type="number"
                  step="0.01"
                  class="form-control"
                  id="inputMontoPresupuesto"
                  required
                />
              </div>

              <!-- Cuotas -->
              <div class="mb-3">
                <label for="inputCuotas" class="form-label">
                  Cantidad de Cuotas
                </label>
                <input
                  type="number"
                  min="1"
                  class="form-control"
                  id="inputCuotas"
                  required
                />
              </div>

              <!-- Observaciones -->
              <div class="mb-3">
                <label for="inputObservaciones" class="form-label"
                  >Observaciones</label
                >
                <textarea
                  class="form-control"
                  id="inputObservaciones"
                  rows="3"
                ></textarea>
              </div>
            </div>

            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Cancelar
              </button>
              <button type="submit" class="btn btn-primary">
                Guardar Presupuesto
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script type="module">
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
      import {
        getFirestore,
        doc,
        getDoc,
        getDocs,
        query,
        collection,
        addDoc,
        orderBy,
        deleteDoc,
        updateDoc, // <--- agregalo acá
      } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

      // Firebase Config
      const firebaseConfig = {
        apiKey: "AIzaSyAQwEe9C-ruCZ6TX612zA6FhkxZUJ2rVoc",
        authDomain: "consultoriosapp-f7f08.firebaseapp.com",
        projectId: "consultoriosapp-f7f08",
      };

      const app = initializeApp(firebaseConfig);
      const db = getFirestore(app);

      const idPacienteGlobal = new URLSearchParams(location.search).get("id");
      if (!idPacienteGlobal) {
        alert("No se especificó paciente");
        throw new Error("No se especificó paciente");
      }

      let apellidoPaciente = "",
        nombrePaciente = "";

      // Carga datos personales del paciente
      async function cargarDatosPaciente() {
        const docRef = doc(db, "pacientes", idPacienteGlobal);
        const docSnap = await getDoc(docRef);
        if (!docSnap.exists()) {
          alert("Paciente no encontrado");
          return;
        }
        const paciente = docSnap.data();

        apellidoPaciente = paciente.apellido?.toLowerCase().trim() || "";
        nombrePaciente = paciente.nombre?.toLowerCase().trim() || "";

        document.getElementById("datosPaciente").innerHTML = `
                <p><strong>Apellido:</strong> ${paciente.apellido || "-"}</p>
                <p><strong>Nombre:</strong> ${paciente.nombre || "-"}</p>
                <p><strong>DNI:</strong> ${paciente.dni || "-"}</p>
                <p><strong>Teléfono:</strong> ${paciente.telefono || "-"}</p>
                <p><strong>Dirección:</strong> ${paciente.direccion || "-"}</p>
                <p><strong>Género:</strong> ${paciente.genero || "-"}</p>
                <p><strong>Obra Social:</strong> ${
                  paciente.obraSocial || "-"
                }</p>
                <p><strong>Fecha Nac.:</strong> ${
                  paciente.fechaNacimiento || "-"
                }</p>
                <p><strong>Ingreso:</strong> ${paciente.fechaIngreso || "-"}</p>
              `;
      }

      // Función para cargar turnos en el select para notas clínicas
      async function cargarTurnosParaSelect() {
        const q = query(collection(db, "turnos"), orderBy("fecha", "desc"));
        const snapshot = await getDocs(q);
        const select = document.getElementById("selectTurnoParaNota");
        select.innerHTML = "";

        const turnosPaciente = [];
        snapshot.forEach((docu) => {
          const turno = docu.data();
          if (String(turno.pacienteId) === idPacienteGlobal) {
            turnosPaciente.push({ id: docu.id, ...turno });
          }
        });

        if (turnosPaciente.length === 0) {
          const option = document.createElement("option");
          option.textContent = "No hay turnos disponibles";
          option.disabled = true;
          option.value = "";
          select.appendChild(option);
          return;
        }

        turnosPaciente.forEach((turno) => {
          const option = document.createElement("option");
          option.value = turno.id;
          option.textContent = `${turno.fecha} ${turno.hora} - ${
            turno.tipoConsulta || "-"
          }`;
          select.appendChild(option);
        });
      }

      // Cargar notas clínicas
      async function cargarNotas() {
        const q = query(
          collection(db, "notasClinicas"),
          orderBy("fechaCreacion", "desc")
        );
        const snapshot = await getDocs(q);
        const lista = document.getElementById("listaNotasClinicas");
        lista.innerHTML = "";

        const notasPaciente = [];
        snapshot.forEach((docu) => {
          const nota = docu.data();
          if (nota.idPaciente === idPacienteGlobal) {
            notasPaciente.push(nota);
          }
        });

        if (notasPaciente.length === 0) {
          lista.innerHTML =
            "<li class='list-group-item'>No hay notas clínicas registradas.</li>";
          return;
        }

        notasPaciente.forEach((nota) => {
          const li = document.createElement("li");
          li.className = "list-group-item";
          li.innerHTML = `<strong>${nota.fechaTurno} ${nota.horaTurno}</strong><br>${nota.notaTexto}`;
          lista.appendChild(li);
        });
      }

      // Agregar nota clínica
      async function agregarNota(idTurno, notaTexto) {
        const turnoDoc = await getDoc(doc(db, "turnos", idTurno));
        if (!turnoDoc.exists()) {
          alert("Turno no encontrado");
          return;
        }
        const turno = turnoDoc.data();

        await addDoc(collection(db, "notasClinicas"), {
          idPaciente: idPacienteGlobal,
          idTurno,
          fechaTurno: turno.fecha,
          horaTurno: turno.hora,
          notaTexto,
          fechaCreacion: new Date().toISOString(),
          doctor: "Dr. Pérez",
        });
      }

      // Cargar turnos del paciente
      async function cargarTurnos() {
        // Función para cargar presupuestos del paciente y mostrarlos en la ficha
        // Función para cargar presupuestos del paciente y mostrarlos en la ficha

        const lista = document.getElementById("listaTurnosPaciente");
        lista.innerHTML = "";

        try {
          const q = query(collection(db, "turnos"), orderBy("fecha", "desc"));
          const snapshot = await getDocs(q);

          const turnosPaciente = [];

          snapshot.forEach((docu) => {
            const turno = docu.data();
            if (String(turno.pacienteId) === idPacienteGlobal) {
              turnosPaciente.push(turno);
            }
          });

          if (turnosPaciente.length === 0) {
            lista.innerHTML =
              "<li class='list-group-item'>No hay turnos registrados.</li>";
            return;
          }

          turnosPaciente.forEach((turno) => {
            const {
              fecha = "-",
              hora = "-",
              tipoConsulta = "-",
              estado = "",
              asistio,
              montoAbonado = 0,
            } = turno;

            let estadoAMostrar = "";

            if (estado && estado !== "") {
              estadoAMostrar = estado; // "Cancelado", "Ausente", etc.
            } else if (asistio === true) {
              estadoAMostrar = "Asistió";
            } else if (asistio === false) {
              estadoAMostrar = "No asistió";
            } else {
              estadoAMostrar = "Sin estado";
            }

            const li = document.createElement("li");
            li.className = "list-group-item";
            li.innerHTML = `
              <strong>${fecha} ${hora}</strong> - ${tipoConsulta}<br>
              Estado: ${estadoAMostrar}<br>
              Monto abonado: $${montoAbonado.toFixed(2)}
            `;
            lista.appendChild(li);
          });
        } catch (error) {
          lista.innerHTML = `<li class='list-group-item text-danger'>Error al cargar turnos.</li>`;
          console.error("Error al cargar turnos:", error);
        }
      }
      async function cargarPresupuestosPaciente() {
        const contenedor = document.getElementById("listaPresupuestosPaciente");

        // Mostrar spinner mientras carga
        contenedor.innerHTML = `
    <div class="d-flex justify-content-center align-items-center" style="height:150px;">
      <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
      <span class="ms-2 fs-5 text-muted">Cargando presupuestos...</span>
    </div>`;

        try {
          const q = query(
            collection(db, "presupuestos"),
            orderBy("fechaCreacion", "desc")
          );
          const snapshot = await getDocs(q);

          const presupuestos = [];
          snapshot.forEach((docu) => {
            const presupuesto = docu.data();
            if (
              String(presupuesto.pacienteId).trim() ===
              String(idPacienteGlobal).trim()
            ) {
              presupuestos.push({ id: docu.id, ...presupuesto });
            }
          });

          // Evento botón Nuevo Presupuesto (solo si está)
          const btnNuevo = document.getElementById("btnNuevoPresupuestoFicha");
          if (btnNuevo) {
            btnNuevo.onclick = () => {
              const inputNombre = document.getElementById(
                "inputNombrePacientePresupuesto"
              );
              if (inputNombre) {
                inputNombre.disabled = true;
                const paciente = pacientesGlobal.find(
                  (p) => p.id === idPacienteGlobal
                );
                if (paciente) {
                  inputNombre.value = `${paciente.apellido}, ${paciente.nombre}`;
                  inputNombre.dataset.pacienteId = paciente.id;
                }
              }
              const modal = new bootstrap.Modal(
                document.getElementById("modalNuevoPresupuesto")
              );
              modal.show();
            };
          }

          // Si no hay presupuestos
          if (presupuestos.length === 0) {
            contenedor.innerHTML = `
        <div class="alert alert-info text-center" role="alert" style="font-size:1.1rem;">
          No hay presupuestos registrados para este paciente.
        </div>`;
            return;
          }

          // Limpiar contenedor para insertar las cards
          contenedor.innerHTML = "";

          presupuestos.forEach((presu) => {
            const {
              id,
              fechaCreacion = "-",
              tratamiento = "-",
              total = 0,
              estado = "Pendiente",
              pagos = [],
            } = presu;

            const totalPagado = pagos.reduce(
              (acc, pago) => acc + (pago.monto || 0),
              0
            );
            const saldoRestante = total - totalPagado;

            let estadoMostrar = estado;
            if (saldoRestante <= 0) {
              estadoMostrar = "Pagado";
            } else if (totalPagado > 0) {
              estadoMostrar = "Parcial";
            } else {
              estadoMostrar = "Pendiente";
            }

            let tablaPagos = `
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="mb-0 fw-bold text-primary">Pagos realizados</h6>
          <button id="btnRegistrarPago-${id}" class="btn btn-sm btn-success shadow-sm">
            Registrar pago
          </button>
        </div>
        <table class="table table-bordered table-hover table-sm align-middle">
          <thead class="table-light">
            <tr>
              <th scope="col" style="width:30%;">Fecha de Pago</th>
              <th scope="col" style="width:40%;">Método de Pago</th>
              <th scope="col" style="width:30%;">Monto</th>
            </tr>
          </thead>
          <tbody>`;

            if (pagos.length === 0) {
              tablaPagos += `
            <tr>
              <td colspan="3" class="text-center text-muted">No se registraron pagos aún.</td>
            </tr>`;
            } else {
              pagos.forEach((pago) => {
                tablaPagos += `
            <tr>
              <td>${pago.fechaPago || "-"}</td>
              <td>${pago.metodoPago || "-"}</td>
              <td>$${(pago.monto || 0).toFixed(2)}</td>
            </tr>`;
              });
            }

            tablaPagos += `</tbody></table>`;

            const html = `
        <div class="d-flex flex-wrap gap-4 mb-5" style="align-items: flex-start;">
          <div class="card shadow-sm p-4 rounded" style="flex: 1 1 350px; min-width: 350px; max-width: 380px; font-size: 1.1rem; background: #f0f6ff;">
            <h5 class="text-primary mb-3 fw-bold">Resumen del Presupuesto</h5>
            <p><strong>Fecha:</strong> ${fechaCreacion}</p>
            <p><strong>Tratamiento:</strong> ${tratamiento}</p>
            <p><strong>Total:</strong> <span class="text-success fw-semibold">$${total.toFixed(
              2
            )}</span></p>
            <p><strong>Total pagado:</strong> <span class="text-info fw-semibold">$${totalPagado.toFixed(
              2
            )}</span></p>
            <p><strong>Saldo restante:</strong> <span class="text-danger fw-semibold">$${saldoRestante.toFixed(
              2
            )}</span></p>
            <p><strong>Estado:</strong> ${
              estadoMostrar.toLowerCase() === "pendiente"
                ? `<span class="badge bg-warning text-dark">${estadoMostrar}</span>`
                : estadoMostrar.toLowerCase() === "parcial"
                ? `<span class="badge bg-info text-white">${estadoMostrar}</span>`
                : `<span class="badge bg-success">${estadoMostrar}</span>`
            }</p>
          </div>
          <div class="card shadow-sm p-4 rounded flex-grow-2" style="min-width: 600px; max-width: 900px;">
            ${tablaPagos}
          </div>
        </div>`;

            contenedor.insertAdjacentHTML("beforeend", html);
          });

          // Eventos "Registrar pago"
          presupuestos.forEach((presu) => {
            const btn = document.getElementById(`btnRegistrarPago-${presu.id}`);
            if (btn) {
              btn.onclick = () => {
                const modal = new bootstrap.Modal(
                  document.getElementById("modalPagoParcial")
                );
                document.getElementById("inputPresupuestoId").value = presu.id;
                const hoy = new Date().toISOString().split("T")[0];
                document.getElementById("inputFechaPago").value = hoy;
                document.getElementById("inputMontoPago").value = "";
                document.getElementById("inputMetodoPago").value = "";
                modal.show();
              };
            }
          });
        } catch (error) {
          contenedor.innerHTML = `
      <div class="alert alert-danger text-center" role="alert" style="font-size:1.1rem;">
        Error al cargar presupuestos.
      </div>`;
          console.error("Error al cargar presupuestos:", error);
        }
      }

      document
        .getElementById("formPagoParcial")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const presupuestoId =
            document.getElementById("inputPresupuestoId").value;
          const fechaPago = document.getElementById("inputFechaPago").value;
          const montoPago = parseFloat(
            document.getElementById("inputMontoPago").value
          );
          const metodoPago = document.getElementById("inputMetodoPago").value;

          if (!presupuestoId) {
            alert("No se especificó presupuesto.");
            return;
          }
          if (!fechaPago || isNaN(montoPago) || montoPago <= 0 || !metodoPago) {
            alert("Por favor, complete todos los campos correctamente.");
            return;
          }

          try {
            const presupuestoRef = doc(db, "presupuestos", presupuestoId);
            const presupuestoSnap = await getDoc(presupuestoRef);
            if (!presupuestoSnap.exists()) {
              alert("Presupuesto no encontrado.");
              return;
            }

            const presupuestoData = presupuestoSnap.data();
            const pagosActuales = presupuestoData.pagos || [];

            const nuevoPago = {
              fechaPago,
              monto: montoPago,
              metodoPago,
              fechaRegistro: new Date().toISOString(),
            };

            pagosActuales.push(nuevoPago);

            // Calcular nuevo estado:
            const total = presupuestoData.total || 0;
            const totalPagado = pagosActuales.reduce(
              (acc, p) => acc + (p.monto || 0),
              0
            );
            const saldoRestante = total - totalPagado;
            const nuevoEstado =
              saldoRestante <= 0
                ? "Pagado"
                : totalPagado > 0
                ? "Parcial"
                : "Pendiente";

            await updateDoc(presupuestoRef, {
              pagos: pagosActuales,
              estado: nuevoEstado,
            });

            const modalEl = document.getElementById("modalPagoParcial");
            const modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();

            await cargarPresupuestosPaciente();
          } catch (error) {
            console.error("Error al guardar pago parcial:", error);
            alert("Error al guardar el pago. Intente nuevamente.");
          }
        });

      document
        .getElementById("formPagoParcial")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          const presupuestoId =
            document.getElementById("inputPresupuestoId").value;
          const cuotaNumero = document.getElementById("inputCuotaNumero").value;
          const fechaPago = document.getElementById("inputFechaPago").value;
          const montoPago = parseFloat(
            document.getElementById("inputMontoPago").value
          );
          const metodoPago = document.getElementById("inputMetodoPago").value;

          if (!presupuestoId) {
            alert("No se especificó presupuesto.");
            return;
          }
          if (!fechaPago || isNaN(montoPago) || montoPago <= 0 || !metodoPago) {
            alert("Por favor, complete todos los campos correctamente.");
            return;
          }

          try {
            const presupuestoRef = doc(db, "presupuestos", presupuestoId);
            const presupuestoSnap = await getDoc(presupuestoRef);
            if (!presupuestoSnap.exists()) {
              alert("Presupuesto no encontrado.");
              return;
            }

            const presupuestoData = presupuestoSnap.data();
            const cuotas = presupuestoData.cuotas || 1;

            const nuevoPago = {
              cuotaNumero: cuotaNumero ? parseInt(cuotaNumero) : null,
              fechaPago,
              monto: montoPago,
              metodoPago,
              fechaRegistro: new Date().toISOString(),
            };

            const pagosActuales = presupuestoData.pagos || [];
            pagosActuales.push(nuevoPago);

            const cuotasPagadas = [
              ...new Set(pagosActuales.map((p) => p.cuotaNumero)),
            ].length;

            const nuevoEstado =
              cuotasPagadas >= cuotas ? "Pagado" : "Pendiente";

            await updateDoc(presupuestoRef, {
              pagos: pagosActuales,
              estado: nuevoEstado,
            });

            const modalEl = document.getElementById("modalPagoParcial");
            const modal = bootstrap.Modal.getInstance(modalEl);
            modal.hide();

            cargarPresupuestosPaciente();
          } catch (error) {
            console.error("Error al guardar pago parcial:", error);
            alert("Error al guardar el pago. Intente nuevamente.");
          }
        });

      async function cargarPagos() {
        const snapshot = await getDocs(collection(db, "caja"));
        const lista = document.getElementById("listaPagosPaciente");
        lista.innerHTML = "";

        const pagos = [];

        snapshot.forEach((docu) => {
          const pago = docu.data();
          if (
            String(pago.pacienteId).trim() === String(idPacienteGlobal).trim()
          ) {
            pagos.push(pago);
          }
        });

        if (pagos.length === 0) {
          lista.innerHTML =
            "<li class='list-group-item'>No hay pagos registrados.</li>";
          return;
        }

        pagos.sort((a, b) => {
          const fechaA = new Date(a.fecha + "T" + (a.hora || "00:00"));
          const fechaB = new Date(b.fecha + "T" + (b.hora || "00:00"));
          return fechaA - fechaB;
        });

        pagos.forEach((p) => {
          const li = document.createElement("li");
          li.className = "list-group-item";
          li.innerHTML = `<strong>${p.fecha}</strong> - $${Math.abs(
            p.monto
          ).toFixed(2)}<br>${p.tipoConsulta || "-"}`;
          lista.appendChild(li);
        });
      }

      document
        .getElementById("btnVolver")
        .addEventListener("click", () => window.close());

      (async () => {
        await cargarDatosPaciente();
        await Promise.all([
          cargarTurnosParaSelect(),
          cargarTurnos(),
          cargarNotas(),
          cargarPagos(),
          cargarImagenesPaciente(),
          cargarPresupuestosPaciente(),
        ]);
      })();

      document
        .getElementById("btnAgregarNota")
        .addEventListener("click", async () => {
          const idTurno = document.getElementById("selectTurnoParaNota").value;
          const texto = document.getElementById("inputTextoNota").value.trim();
          if (!idTurno || !texto) {
            alert("Seleccioná un turno y escribí la nota.");
            return;
          }
          await agregarNota(idTurno, texto);
          await cargarNotas();
          document.getElementById("inputTextoNota").value = "";
          alert("Nota guardada.");
        });

      async function refrescarFicha() {
        await cargarDatosPaciente();
        await Promise.all([
          cargarTurnosParaSelect(),
          cargarTurnos(),
          cargarNotas(),
          cargarPagos(),
          cargarImagenesPaciente(),
        ]);
      }

      document
        .getElementById("btnRefrescarFicha")
        .addEventListener("click", async () => {
          await refrescarFicha();
        });

      // ----------- IMÁGENES Y PLACAS con Cloudinary -----------

      document
        .getElementById("btnSubirImagen")
        .addEventListener("click", async () => {
          const fileInput = document.getElementById("inputImagen");
          const file = fileInput.files[0];
          if (!file) {
            alert("Seleccioná una imagen primero.");
            return;
          }

          const descripcionInput = document.getElementById(
            "inputDescripcionImagen"
          );
          const descripcion = descripcionInput.value.trim();

          const fechaSubida = new Date().toISOString();

          const formData = new FormData();
          formData.append("file", file);
          formData.append("upload_preset", "consultorio_unsigned"); // Tu upload preset aquí
          formData.append("folder", "consultorio"); // opcional, para organizar en Cloudinary

          try {
            const res = await fetch(
              "https://api.cloudinary.com/v1_1/dcljeqcng/image/upload",
              {
                method: "POST",
                body: formData,
              }
            );

            const data = await res.json();

            if (!res.ok) {
              throw new Error(data.error?.message || "Error al subir imagen");
            }

            const urlCloudinary = data.secure_url;

            await addDoc(collection(db, "imagenesPacientes"), {
              idPaciente: idPacienteGlobal,
              url: urlCloudinary,
              descripcion: descripcion || "",
              fecha: fechaSubida,
            });

            alert("Imagen subida con éxito.");
            fileInput.value = "";
            descripcionInput.value = "";
            cargarImagenesPaciente();
          } catch (error) {
            console.error("Error al subir imagen a Cloudinary:", error);
            alert("Error al subir imagen. Revisa la consola.");
          }
        });

      async function cargarImagenesPaciente() {
        try {
          const lista = document.getElementById("listaImagenes");
          lista.innerHTML = "";

          const q = query(
            collection(db, "imagenesPacientes"),
            orderBy("fecha", "desc")
          );
          const snapshot = await getDocs(q);

          const imagenes = [];

          snapshot.forEach((docu) => {
            const img = docu.data();
            img.id = docu.id;
            if (String(img.idPaciente) === String(idPacienteGlobal)) {
              imagenes.push(img);
            }
          });

          if (imagenes.length === 0) {
            lista.innerHTML =
              "<p class='text-muted'>No hay imágenes subidas.</p>";
            return;
          }

          imagenes.forEach((img) => {
            const col = document.createElement("div");
            col.className = "col-md-4";
            col.style.position = "relative";

            col.innerHTML = `
              <div class="card mb-3">
                <img src="${
                  img.url
                }" class="card-img-top" alt="Imagen del paciente" style="cursor:pointer;" />
                <div class="card-body">
                  <p class="card-text">${
                    img.descripcion || "(Sin descripción)"
                  }</p>
                  <small class="text-muted">${new Date(
                    img.fecha
                  ).toLocaleString()}</small>
                </div>
                <button class="btn btn-danger btn-sm btn-eliminar-imagen" style="
                  position: absolute;
                  top: 5px;
                  right: 5px;
                  border-radius: 50%;
                  width: 25px;
                  height: 25px;
                  padding: 0;
                  line-height: 22px;
                  font-weight: bold;
                  text-align: center;
                  cursor: pointer;
                ">×</button>
              </div>
            `;

            col.querySelector("img").addEventListener("click", () => {
              document.getElementById("imagenModal").src = img.url;
              document.getElementById("descripcionModal").textContent =
                img.descripcion || "(Sin descripción)";
              document.getElementById("fechaModal").textContent = new Date(
                img.fecha
              ).toLocaleString();

              const modal = new bootstrap.Modal(
                document.getElementById("modalImagenAmpliada")
              );
              modal.show();
            });

            col
              .querySelector(".btn-eliminar-imagen")
              .addEventListener("click", async () => {
                if (
                  !confirm(
                    "¿Querés eliminar esta imagen? Esta acción no se puede deshacer."
                  )
                )
                  return;

                console.log("Intentando eliminar imagen con id:", img.id);
                try {
                  await deleteDoc(doc(db, "imagenesPacientes", img.id));
                  alert("Imagen eliminada correctamente.");
                  cargarImagenesPaciente();
                } catch (error) {
                  console.error("Error al eliminar imagen:", error);
                  alert("No se pudo eliminar la imagen. Revisa la consola.");
                }
              });

            lista.appendChild(col);
          });
        } catch (error) {
          console.error("Error en cargarImagenesPaciente:", error);
        }
      }

      // ----------- RECETAS (simulación, guardar en memoria) -----------

      let recetasGuardadas = [];

      document
        .getElementById("btnGuardarReceta")
        .addEventListener("click", () => {
          const texto = document
            .getElementById("inputRecetaTexto")
            .value.trim();
          if (!texto) {
            alert("Escribí una receta");
            return;
          }

          const receta = {
            texto,
            fecha: new Date().toLocaleDateString(),
          };
          recetasGuardadas.unshift(receta);

          const li = document.createElement("li");
          li.className = "list-group-item";
          li.innerHTML = `<strong>${receta.fecha}</strong><br>${receta.texto}`;
          document.getElementById("listaRecetas").prepend(li);

          document.getElementById("inputRecetaTexto").value = "";
          alert("Receta guardada");
        });

      const imagenModal = document.getElementById("imagenModal");

      let escala = 1;

      imagenModal.addEventListener("wheel", (e) => {
        e.preventDefault();

        const delta = e.deltaY > 0 ? -0.1 : 0.1; // scroll abajo = zoom out, scroll arriba = zoom in
        escala += delta;

        if (escala < 1) escala = 1; // no puede ser menor que 1 (no hacer zoom menor a tamaño original)
        if (escala > 5) escala = 5; // máximo 5x zoom

        imagenModal.style.transform = `scale(${escala})`;
      });

      // Reseteamos el zoom cuando cerramos el modal
      const modalImagen = document.getElementById("modalImagenAmpliada");
      modalImagen.addEventListener("hidden.bs.modal", () => {
        escala = 1;
        imagenModal.style.transform = "scale(1)";
      });

      // Crear instancia del modal
      const modalNuevoPresupuesto = new bootstrap.Modal(
        document.getElementById("modalNuevoPresupuesto")
      );

      // Evento para abrir modal y preparar formulario
      document
        .getElementById("btnAbrirNuevoPresupuesto")
        .addEventListener("click", () => {
          // Colocar fecha actual por defecto
          const hoy = new Date().toISOString().split("T")[0];
          document.getElementById("inputFechaPresupuesto").value = hoy;

          // Limpiar campos
          document.getElementById("inputTratamiento").value = "";
          document.getElementById("inputMontoPresupuesto").value = "";
          document.getElementById("inputCuotas").value = "1";
          document.getElementById("inputObservaciones").value = "";

          modalNuevoPresupuesto.show();
        });

      // Evento submit del formulario
      document
        .getElementById("formNuevoPresupuesto")
        .addEventListener("submit", async (e) => {
          e.preventDefault();

          // Tomar valores del formulario
          const fecha = document.getElementById("inputFechaPresupuesto").value;
          const tratamiento = document
            .getElementById("inputTratamiento")
            .value.trim();
          const monto = parseFloat(
            document.getElementById("inputMontoPresupuesto").value
          );
          const cuotas = parseInt(document.getElementById("inputCuotas").value);
          const observaciones = document
            .getElementById("inputObservaciones")
            .value.trim();

          // Validar
          if (
            !fecha ||
            !tratamiento ||
            isNaN(monto) ||
            monto <= 0 ||
            isNaN(cuotas) ||
            cuotas < 1
          ) {
            alert(
              "Por favor, complete correctamente todos los campos obligatorios."
            );
            return;
          }

          // Aquí pones tu lógica para guardar en Firebase o donde corresponda
          try {
            await addDoc(collection(db, "presupuestos"), {
              pacienteId: idPacienteGlobal, // <-- aquí cambia idPaciente por pacienteId
              fechaCreacion: fecha,
              tratamiento,
              total: monto,
              cuotas,
              observaciones,
              estado: "Pendiente",
              pagos: [],
              fechaRegistro: new Date().toISOString(),
            });

            alert("Presupuesto creado con éxito.");
            modalNuevoPresupuesto.hide();
            // Recarga tus presupuestos o refresca ficha
            cargarPresupuestosPaciente();
          } catch (error) {
            console.error("Error al crear presupuesto:", error);
            alert("Error al guardar el presupuesto. Intenta nuevamente.");
          }
        });

      async function cargarPresupuestosPacienteModal(idPaciente) {
        const contenedor = document.getElementById("listaPresupuestosPaciente");

        // Mostrar spinner mientras carga
        contenedor.innerHTML = `
    <div class="d-flex justify-content-center align-items-center" style="height:150px;">
      <div class="spinner-border text-primary" role="status" aria-hidden="true"></div>
      <span class="ms-2 fs-5 text-muted">Cargando presupuestos del paciente...</span>
    </div>`;

        try {
          const q = query(
            collection(db, "presupuestos"),
            where("idPaciente", "==", idPaciente), // Cambiado aquí
            orderBy("fechaRegistro", "desc") // Cambiado aquí
          );
          const snapshot = await getDocs(q);

          const presupuestos = [];
          snapshot.forEach((docu) => {
            presupuestos.push({ id: docu.id, ...docu.data() });
          });

          if (presupuestos.length === 0) {
            contenedor.innerHTML = `
        <div class="alert alert-info text-center" role="alert" style="font-size:1.1rem;">
          No hay presupuestos registrados para este paciente.
        </div>`;
            return;
          }

          contenedor.innerHTML = "";

          presupuestos.forEach((presu) => {
            const {
              id,
              fechaRegistro: fechaCreacion = "-",
              tratamiento = "-",
              total = 0,
              estado = "Pendiente",
              pagos = [],
            } = presu;

            const totalPagado = pagos.reduce(
              (acc, pago) => acc + (pago.monto || 0),
              0
            );
            const saldoRestante = total - totalPagado;

            let estadoMostrar = estado;
            if (saldoRestante <= 0) {
              estadoMostrar = "Pagado";
            } else if (totalPagado > 0) {
              estadoMostrar = "Parcial";
            } else {
              estadoMostrar = "Pendiente";
            }

            let tablaPagos = `
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h6 class="mb-0 fw-bold text-primary">Pagos realizados</h6>
          <button id="btnRegistrarPago-${id}" class="btn btn-sm btn-success shadow-sm">
            Registrar pago
          </button>
        </div>
        <table class="table table-bordered table-hover table-sm align-middle">
          <thead class="table-light">
            <tr>
              <th scope="col" style="width:30%;">Fecha de Pago</th>
              <th scope="col" style="width:40%;">Método de Pago</th>
              <th scope="col" style="width:30%;">Monto</th>
            </tr>
          </thead>
          <tbody>`;

            if (pagos.length === 0) {
              tablaPagos += `
          <tr>
            <td colspan="3" class="text-center text-muted">No se registraron pagos aún.</td>
          </tr>`;
            } else {
              pagos.forEach((pago) => {
                tablaPagos += `
            <tr>
              <td>${pago.fechaPago || "-"}</td>
              <td>${pago.metodoPago || "-"}</td>
              <td>$${(pago.monto || 0).toFixed(2)}</td>
            </tr>`;
              });
            }

            tablaPagos += `</tbody></table>`;

            const html = `
        <div class="d-flex flex-wrap gap-4 mb-5" style="align-items: flex-start;">
          <div class="card shadow-sm p-4 rounded" style="flex: 1 1 350px; min-width: 350px; max-width: 380px; font-size: 1.1rem; background: #f0f6ff;">
            <h5 class="text-primary mb-3 fw-bold">Resumen del Presupuesto</h5>
            <p><strong>Fecha:</strong> ${fechaCreacion}</p>
            <p><strong>Tratamiento:</strong> ${tratamiento}</p>
            <p><strong>Total:</strong> <span class="text-success fw-semibold">$${total.toFixed(
              2
            )}</span></p>
            <p><strong>Total pagado:</strong> <span class="text-info fw-semibold">$${totalPagado.toFixed(
              2
            )}</span></p>
            <p><strong>Saldo restante:</strong> <span class="text-danger fw-semibold">$${saldoRestante.toFixed(
              2
            )}</span></p>
            <p><strong>Estado:</strong> ${
              estadoMostrar.toLowerCase() === "pendiente"
                ? `<span class="badge bg-warning text-dark">${estadoMostrar}</span>`
                : estadoMostrar.toLowerCase() === "parcial"
                ? `<span class="badge bg-info text-white">${estadoMostrar}</span>`
                : `<span class="badge bg-success">${estadoMostrar}</span>`
            }</p>
          </div>
          <div class="card shadow-sm p-4 rounded flex-grow-2" style="min-width: 600px; max-width: 900px;">
            ${tablaPagos}
          </div>
        </div>`;

            contenedor.insertAdjacentHTML("beforeend", html);
          });

          // Eventos para botones "Registrar pago"
          presupuestos.forEach((presu) => {
            const btn = document.getElementById(`btnRegistrarPago-${presu.id}`);
            if (btn) {
              btn.onclick = () => {
                const modal = new bootstrap.Modal(
                  document.getElementById("modalPagoParcial")
                );
                document.getElementById("inputPresupuestoId").value = presu.id;
                const hoy = new Date().toISOString().split("T")[0];
                document.getElementById("inputFechaPago").value = hoy;
                document.getElementById("inputMontoPago").value = "";
                document.getElementById("inputMetodoPago").value = "";
                modal.show();
              };
            }
          });
        } catch (error) {
          contenedor.innerHTML = `
      <div class="alert alert-danger text-center" role="alert" style="font-size:1.1rem;">
        Error al cargar presupuestos del paciente.
      </div>`;
          console.error("Error al cargar presupuestos del paciente:", error);
        }
      }

      cargarPresupuestosPacienteModal(idPacienteGlobal);
    </script>
  </body>
